name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Type check the viewer
        run: npm run check:ui
      - name: The committed viewer matches its sources
        run: npm run build:ui && git diff --exit-code viewer
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run
