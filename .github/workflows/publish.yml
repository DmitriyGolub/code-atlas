name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check:ui
      - run: npm test
      - name: The release tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      - name: npm with trusted publishing support
        run: npm install --global npm@latest
      - name: Publish through npm trusted publishing, no token is stored
        run: npm publish --provenance --access public
